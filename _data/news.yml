- date: 2018-05-15
  title: "Demo Program Committee, ECML-PKDD 2018"
  text: "I am also invited to serve on the Program Committee for the <a href=\"http://www.ecmlpkdd2018.org/\">ECML-PKDD 2018</a> Demo Track. ECML-PKDD 2018 will take place in Dublin, Ireland, on 10–14 September 2018."

- date: 2018-05-03
  title: "Demo Program Committee, EMNLP 2018"
  text: "I am invited to serve on the Program Committee for the <a href=\"http://emnlp2018.org/\">EMNLP 2018</a> Demonstration Track. EMNLP 2018 will be held in Brussels, Belgium, on November 2–4, 2018."

